apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-demo-frontend
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/705jul/k8s-manifest-repo.git
    targetRevision: main
    path: apps/frontend/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: eks-demo-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
